# YALNIZ YEREL DENEME (bu bilgisayarda): üretim compose'unun üzerine eklenir.
#   docker network create nginx-proxy-network   (bir kez; sunucudaki nginx ağının yerel karşılığı)
#   docker compose -f compose.yaml -f compose.yerel.yaml --env-file .env.yerel up -d --build
# Farklar: nginx yok — yönlendirici doğrudan http://localhost:8080'de; e-posta gönderilmez (.env.yerel'de
# EPOSTA_DOGRULAMASIZ=true); yedek deposu R2 yerine yerel bir Docker birimi (posix). Gerçek kişi verisi KULLANILMAZ.
services:
  yonlendirici:
    ports:
      - '127.0.0.1:8080:80'
  db:
    volumes:
      - yedek-deposu:/yedek-deposu
  yedekci:
    volumes:
      - yedek-deposu:/yedek-deposu

volumes:
  yedek-deposu:
